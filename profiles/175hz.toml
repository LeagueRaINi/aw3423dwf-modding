# 175 Hz: hardware-tested; runs with no visible artifacts or frame skipping.
# Build from Dell's stock M3B107 UPG. Expected output sha256:
#   56f7bdb33d0da8322da62b88ef180d7b9db9295ce5f4ee6e5b66fae937a7b871
# Raises the firmware refresh ceilings, keeps the stock output clock window (the panel pixel clock
# is limited near 1,021,760 kHz), and lowers the 1708-line output vertical-total floor to 1620 so
# the firmware shortens the vertical blank (~1629 lines at 175 Hz). Long-term panel effects of the
# shorter blank are unknown.

# Remap the 12 DELA211..A21C product IDs to DELA2E1..A2EC so Windows Update does not install the
# Alienware Command Center monitor driver package over the custom modes.
[pid]
from = 0xA211
to = 0xA2E1
count = 12

# Monitor name "AW3423DWF" -> "AW3423DWF-CF".
[name]
base = "AW3423DWF"
suffix = "-CF"

[range]
max_vhz = 175

# Firmware refresh ceiling for the input validators, DP output clamps and panel-output cap.
[refresh]
cap_hz = 240

# Stock nominal/fallback refresh and output clock window; only the maxima follow cap_hz.
[output]
nominal_hz = 165
clock_nominal_khz = 1016000
clock_max_khz = 1021760
clock_min_khz = 1010205

[panel]
dv_total_min = 1620

# DisplayID Type-I modes: 3440x1440, Htot 3520 (8/32/40), Vtot 1484 (3/10/31).
[[mode]]
label = "175Hz"
pclk_khz = 914144
ha = 3440
hfp = 8
hsw = 32
hbl = 80
va = 1440
vfp = 3
vsw = 10
vbl = 44

[[mode]]
label = "170Hz"
pclk_khz = 888026
ha = 3440
hfp = 8
hsw = 32
hbl = 80
va = 1440
vfp = 3
vsw = 10
vbl = 44

[[mode]]
label = "165Hz-10bpc"
pclk_khz = 861940
ha = 3440
hfp = 8
hsw = 32
hbl = 80
va = 1440
vfp = 3
vsw = 10
vbl = 44
